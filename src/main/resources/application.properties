spring.application.name=MeterReading

# Database configuration (environment variable or default)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/MeterReading_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:manager}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Gemini API Key (overridden in application-secrets.properties or environment)
gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_API_KEY}

# WhatsApp Cloud API (overridden in application-secrets.properties or environment)
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:1278590508671882}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:${whatsapp_token:YOUR_WHATSAPP_ACCESS_TOKEN}}
whatsapp.graph.url=${WHATSAPP_GRAPH_URL:https://graph.facebook.com/v23.0}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Admin credentials
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}

# Import local secrets (file is gitignored to protect sensitive keys)
spring.config.import=optional:classpath:application-secrets.properties,optional:file:application-secrets.properties